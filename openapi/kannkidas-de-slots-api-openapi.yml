openapi: 3.2.0
info:
  title: Kann KI das? Slots API
  version: 1.1.0
  description: Faceted product search plus machine-readable availability and buyer-confirmed Stripe Checkout for fixed sponsor placements.
servers:
- url: https://kannkidas.de/api
tags:
- name: Slots
paths:
  /slots:
    get:
      operationId: listSponsorSlots
      summary: List live sponsor-slot availability
      responses:
        '200':
          description: Current slot states
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotList'
      tags:
      - Slots
components:
  schemas:
    SlotList:
      type: object
      required:
      - slots
      properties:
        slots:
          type: array
          items:
            type: object
            required:
            - id
            - status
            properties:
              id:
                type: string
              status:
                enum:
                - available
                - held
                - sold
                - active
  securitySchemes:
    clientBasic:
      type: http
      scheme: basic
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://kannkidas.de/api/oauth/token
          scopes:
            sponsorship:read: Read own purchase status
            sponsorship:write: Create a confirmed checkout

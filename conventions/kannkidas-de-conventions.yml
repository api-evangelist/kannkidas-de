    page: current page
    perPage: page size
    hits: array
    facets: object
  applies_to: [searchProductsAndCategories]
  docs: https://kannkidas.de/openapi.json

field_expansion:
  supported: false
metadata:
  supported: false

request_tracing:
  request_id_header: apigw-requestid
  description: Observed on every /api response (AWS API Gateway behind CloudFront); not documented by the provider.

caching:
  observed:
    - {path: /api/slots, cache_control: 'public, max-age=15, s-maxage=15'}
    - {path: /api/search, cache_control: no-store}
    - {path: /api/v1, cache_control: no-store}

versioning:
  scheme: none-in-request
  current: 1.1.0 (info.version)
  detail: lifecycle/kannkidas-de-lifecycle.yml

error_envelope:
  media_type: application/json
  rfc9457: false
  shape: '{ "message": string }'
  detail: errors/kannkidas-de-problem-types.yml

rate_limits:
  documented: false
  signal_status: null
  headers_observed: []
  detail: rate-limits/kannkidas-de-rate-limits.yml

payments:
  handler: Stripe hosted Checkout (x-payment-info intent session, amount 99000 EUR cents)
  rule: Card, bank, tax and invoice data go only to the Stripe page; the API never receives them (AGENTS.md, auth.md).
  claim_paid_only_when: Purchase.status == paid

other_conventions:
  - name: Markdown twins
    detail: Every indexable HTML page is also served as text/markdown via Accept negotiation or a .md suffix (verified on /produkte/asana/).
  - name: Amounts
    detail: Integer euro cents (amount const 99000); currency const EUR.
  - name: Identifiers
    detail: 'Slots P01-P10 (^P(?:0[1-9]|10)$); purchases pur_<32 hex>; products lowercase slug ^[a-z0-9][a-z0-9-]*$.'
  - name: Browser and DNS discovery
    detail: WebMCP exposes the two tools in-page; DNS-AID TXT at _index._agents.kannkidas.de (AGENTS.md).

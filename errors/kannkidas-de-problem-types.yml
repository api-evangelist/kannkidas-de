  - status: 400
    title: Invalid registration
    source_operation: openapi/kannkidas-de-openapi.yml#registerAgentClient
    remediation: Body needs name (3-80 chars); scopes must be a unique non-empty subset of [sponsorship:read, sponsorship:write]; no other properties.
  - status: 401
    title: Invalid client
    source_operation: openapi/kannkidas-de-openapi.yml#issueAgentAccessToken
    remediation: Send client_id/client_secret via HTTP Basic (client_secret_basic) with grant_type=client_credentials; the secret is returned exactly once at registration.
  - status: 401
    title: Bearer token missing or invalid
    source_operation: openapi/kannkidas-de-openapi.yml#createSponsorPurchase
    remediation: Send a short-lived opaque bearer token carrying sponsorship:write in the Authorization header only; never in a URL (auth.md).

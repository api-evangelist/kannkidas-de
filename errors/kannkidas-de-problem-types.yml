    remediation: Testnet demo only — pay 1000 base units of USDC on eip155:84532 per the header, or ignore; it is not the sponsoring checkout.
  - status: 404
    title: Unknown purchase
    source_operation: openapi/kannkidas-de-openapi.yml#getSponsorPurchase
    remediation: purchase_id is the pur_<32 hex> value returned by createSponsorPurchase; only the registering client can read its own purchases (scope description "Read own purchase status").
  - status: 409

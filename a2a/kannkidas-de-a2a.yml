surface_relationship:
  note: >-
    The A2A agent is the narrowest of three agent surfaces on the same host and is deliberately read-only. MCP
    (https://kannkidas.de/api/mcp) exposes the same slot read plus create_sponsor_checkout behind OAuth; the REST
    OpenAPI (https://kannkidas.de/api) additionally exposes product search, agent registration, token issuance and
    purchase status. The A2A skill list-sponsor-slots is backed by the REST operation listSponsorSlots.

aid: kannkidas-de
name: Kann KI das? Sponsoring Agent
description: 'Kann KI das? is an independent German-language publisher of build-or-buy test reports that assess
  whether well-known business software can realistically be rebuilt with AI, and where buying remains the better
  decision. The site is financed by ten fixed, clearly labelled sponsor placements (P01-P10, 990 EUR net for 30
  days) that are sold through an agent-native commerce path: a public OpenAPI 3.1.1 contract at kannkidas.de/openapi.json
  (faceted product search, live slot availability, anonymous OAuth 2.0 client registration and client-credentials
  tokens, and a buyer-confirmed, idempotent Stripe hosted checkout), a remote Streamable HTTP MCP server with two
  tools, a read-only A2A agent at /api/a2a with a published agent card, RFC 8414/9728 OAuth discovery, an RFC 9727
  API catalog, provider-published Agent Skills with SHA-256 digests, llms.txt and AGENTS.md, a UCP profile, DNS-AID
  records and a separately marked x402 v2 testnet demo endpoint. The sponsor agent operates in read-only mode; commercial
  writes require OAuth scopes and explicit buyer confirmation.'
image: https://kannkidas.de/og-default.jpg
